# A trailing backtick makes a literal key and is then removed.
literal$`: native-looking literal key
literal@`: text-looking literal key
literal^`: script-looking literal key
final``: one literal final backtick
# Raw/dynamic leading dots are literal output keys, not hidden fields.
.raw`: visible raw dot
"=$'.dynamic'": visible dynamic dot
.hidden: this helper is hidden

value: 4
native: "=$value * 2"
text: "=@value={{ value }}"
script: =^% return value * 3
escaped: "`=$value"
# Inline and field modes compose: the inner @ yields a quoted string, then outer $ evaluates it.
field$: "=@'winner={{ keymode }}'"

# This key is evaluated once, then used literally -- its trailing `$` is not a mode.
name: dynamic$
"=$name": "=$value + 1"

items:
  - "=$value + 2"
  - "=@item={{ value }}"
  - "=^% return value * 4"
  - "`=@item={{ value }}"
