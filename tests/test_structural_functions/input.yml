# Structural functions return a freshly rebound lazy mapping or array.
declared: declaration-value
default: 10

make(x, y=global_root.default, k='generated', v=x * y)=:
  x$: x
  nested:
    product$: x * y
    path$: path
    keyvars@: '{{ keymode }}, "{{ keyname }}", "{{effective_key}}", "{{keypath}}"'
  keyvars@: '{{ keymode }}, "{{ keyname }}", "{{effective_key}}", "{{keypath}}"'
  label@: "{{ context.prefix }}{{ x }}"
  where@: "{{ path }}"
  origin_value$: origin.declared
  root_value$: root.declared
  =$k: =$v

pair(a, b=global_root.default)=: ["=$a", "=@{{ b }}"]

left:
  prefix: left-
  result: "=$global_root.make(2)"
right:
  prefix: right-
  result: "=$global_root.make(3, y=4, k='answer')"
array: "=$pair(7)"

# Structural nodes retain ordinary default layers, including script layers.
.root_native0: {native0: true, shared: native0}
.root_native1: {native1: true, shared: native1}
.root_script0: {script0: true, shared: script0}
.root_script1: {script1: true, shared: script1}
.nested_native0: {native0: true, shared: native0}
.nested_native1: {native1: true, shared: native1}
.nested_script0: {script0: true, shared: script0}
.nested_script1: {script1: true, shared: script1}

layered()=:
  <<$: root.root_native0
  <<1$: root.root_native1
  <<^: "% return root.root_script0"
  <<1^: "% return root.root_script1"
  nested:
    <<$: root.nested_native0
    <<1$: root.nested_native1
    <<^: "% return root.nested_script0"
    <<1^: "% return root.nested_script1"
result: "=$layered()"

duplicate(value)=:
  value$: value
  path$: path
  where$: path
  nested:
    path$: path

duplicate_result^: |
  % set x = global_root.duplicate(10)
  % set warmed = x.value
  % set warmed_nested = x.nested.path
  % set tmp = x.where
  % return {"x": x, "y": x, "tmp": tmp}
