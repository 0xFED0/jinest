name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python regression tests
        run: python jinest.test.py

      - name: Run Python regression tests with assertions disabled
        run: python -O jinest.test.py

      - name: Run portable CLI fixtures
        run: bash run_tests.sh

      - name: Validate documented examples
        run: python examples/validate.py

  jinja-compatibility:
    name: Jinja2 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum (3.1.0)
            python-version: "3.10"
            jinja2: "Jinja2==3.1.0"
          - name: latest (3.1.6)
            python-version: "3.14"
            jinja2: "Jinja2==3.1.6"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install selected Jinja2 and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.jinja2 }}" "PyYAML>=6.0"

      - name: Run Python regression tests
        run: python jinest.test.py
