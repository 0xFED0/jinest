name: Upload release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to release
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: upload-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python regression tests
        run: python jinest.test.py

      - name: Run portable CLI fixtures
        run: bash run_tests.sh

      - name: Validate documented examples
        run: python examples/validate.py

  release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Read version from jinest.py
        id: version
        run: |
          version="$(python - <<'PY2'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("jinest.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if not any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              ):
                  continue
              if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                  print(node.value.value)
                  break
          else:
              raise SystemExit("Could not find string __version__ in jinest.py")
          PY2
          )"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set +e
          response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"
          status=$?
          set -e
          if (( status == 0 )); then
            echo "A GitHub release for $TAG already exists." >&2
            exit 1
          fi
          if ! grep -Eq '(^HTTP/[0-9.]+ 404|\(HTTP 404\))' <<< "$response"; then
            echo "Could not determine whether a release for $TAG exists:" >&2
            printf '%s\n' "$response" >&2
            exit "$status"
          fi

      - name: Verify or create release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --force --tags origin
          head_commit="$(git rev-parse HEAD)"
          mapfile -t commit_tags < <(git tag --points-at HEAD)

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_commit="$(git rev-list -n 1 "$TAG")"
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "$TAG already points to $tag_commit, not the selected commit $head_commit." >&2
              exit 1
            fi
          fi

          for existing_tag in "${commit_tags[@]}"; do
            if [[ "$existing_tag" == v* && "$existing_tag" != "$TAG" ]]; then
              echo "Selected commit has version tag $existing_tag, expected $TAG." >&2
              exit 1
            fi
          done

          if [[ " ${commit_tags[*]} " != *" $TAG "* ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create release and upload jinest.py
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" jinest.py \
            --repo "$GITHUB_REPOSITORY" \
            --title "Jinest $VERSION" \
            --generate-notes
