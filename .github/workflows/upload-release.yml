name: Upload release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to release
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: upload-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve_ref:
    name: Resolve release revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Record immutable commit SHA
        id: revision
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Test source
    needs: resolve_ref
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve_ref.outputs.sha }}

  build_wheel:
    name: Build wheel
    needs: [resolve_ref, test]
    uses: ./.github/workflows/build-wheel.yml
    with:
      ref: ${{ needs.resolve_ref.outputs.sha }}

  test_wheel:
    name: Test wheel
    needs: [resolve_ref, build_wheel]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-wheel.yml
    with:
      ref: ${{ needs.resolve_ref.outputs.sha }}
      artifact_name: ${{ needs.build_wheel.outputs.artifact_name }}

  release:
    name: Create GitHub release
    needs: [resolve_ref, build_wheel, test_wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve_ref.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Read version from jinest.py
        id: version
        run: |
          version="$(python - <<'PY2'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("jinest.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              if not any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              ):
                  continue
              if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                  print(node.value.value)
                  break
          else:
              raise SystemExit("Could not find string __version__ in jinest.py")
          PY2
          )"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify built wheel version
        env:
          WHEEL_VERSION: ${{ needs.build_wheel.outputs.version }}
          SOURCE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$WHEEL_VERSION" != "$SOURCE_VERSION" ]]; then
            echo "Wheel version $WHEEL_VERSION differs from source version $SOURCE_VERSION." >&2
            exit 1
          fi

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set +e
          response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"
          status=$?
          set -e
          if (( status == 0 )); then
            echo "A GitHub release for $TAG already exists." >&2
            exit 1
          fi
          if ! grep -Eq '(^HTTP/[0-9.]+ 404|\(HTTP 404\))' <<< "$response"; then
            echo "Could not determine whether a release for $TAG exists:" >&2
            printf '%s\n' "$response" >&2
            exit "$status"
          fi

      - name: Verify or create release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --force --tags origin
          head_commit="$(git rev-parse HEAD)"
          mapfile -t commit_tags < <(git tag --points-at HEAD)

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_commit="$(git rev-list -n 1 "$TAG")"
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "$TAG already points to $tag_commit, not the selected commit $head_commit." >&2
              exit 1
            fi
          fi

          for existing_tag in "${commit_tags[@]}"; do
            if [[ "$existing_tag" == v* && "$existing_tag" != "$TAG" ]]; then
              echo "Selected commit has version tag $existing_tag, expected $TAG." >&2
              exit 1
            fi
          done

          if [[ " ${commit_tags[*]} " != *" $TAG "* ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Download tested wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build_wheel.outputs.artifact_name }}
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          WHEEL: dist/${{ needs.build_wheel.outputs.filename }}
        run: |
          test -f "$WHEEL"
          gh release create "$TAG" jinest.py "$WHEEL" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Jinest $VERSION" \
            --generate-notes
