# Run from the repository root:
#   python examples/08_python_api/run.py
#
# This document needs the custom globals/filters installed by run.py. The runner
# also demonstrates lazy access, in_place=True, non-strict undefined values,
# collected diagnostics, debug locations, and warnings-as-errors.

value: 5

# `double` is a custom Jinja global supplied by Python.
doubled$: double(value)

# `surround` is a custom Jinja filter supplied by Python.
decorated@: '{{ value | surround("<", ">") }}'

# strict=False turns missing native/script values into null.
missing_native$: missing.deep.value
missing_script^: |
  % return missing.deep.value

# Missing text values render as empty text in non-strict mode.
missing_text@: "before{{ missing.deep.value }}after"

# These declarations intentionally produce one warning and one hint. debug=True
# adds their source path and filename to stderr; the runner also inspects the
# same structured messages through Resolver.messages.
selected: literal-wins
selected$: missing.suppressed.expression

.lookup_value: private-for-lookup
lookup_value: public-for-output
