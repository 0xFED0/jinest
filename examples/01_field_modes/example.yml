# Run from the repository root:
#   python jinest.py examples/01_field_modes/example.yml --output-format yaml
#
# This example covers literal fields plus the @, $, and ^ field modes.

project: Jinest
port: 8080
enabled: true

# @ renders a complete Jinja template and always produces text.
label@: "{{ project }} listens on {{ port }}"

# $ evaluates exactly one Jinja expression and preserves its native type.
next_port$: port + 1
settings$: "{'enabled': enabled, 'ports': [port, port + 1]}"

# ^ executes a multiline script. `return` may produce any native value.
status^: |
  % if enabled and port > 0
    % return {
      "state": "ready",
      "endpoint": "http://localhost:" ~ port
    }
  % endif
  % return {"state": "disabled", "endpoint": none}

# Local alternatives use: literal > ^ > $ > @. Every suppressed declaration
# emits a warning, but the deliberately broken alternatives are never evaluated.
priority: literal-wins
priority^: "% return missing.script.value"
priority$: missing.native.value
priority@: "{{ missing.text.value }}"

# Without a literal field, ^ wins over $ and @.
script_priority@: "{{ missing.text.value }}"
script_priority$: missing.native.value
script_priority^: |
  % return 42

# Dot-prefixed fields are hidden intermediate values. Templates access them
# without the dot; they are never written to the final document.
.internal_port$: "port + 1"
.release_id@: "{{ project | lower }}-{{ internal_port }}"

# If both forms exist, templates use .internal_port (8081), while the ordinary
# internal_port is retained only for the final dump. This ambiguity emits a
# hint, separately from the suppression warnings above.
internal_port: published-but-not-used-for-computation
effective_port$: "internal_port + 1"
release_endpoint@: "https://example.test/{{ release_id }}"

# An ordinary YAML null remains a native None/null.
optional: null

# A trailing backtick disables all Jinest parsing for that key and is removed.
# It can preserve a mode-looking suffix or make a leading dot visible.
literal_mode_key$`: this is not an expression
.visible_dot`: this is not a hidden field

# Two final backticks encode one literal final backtick.
literal_backtick``: preserved
