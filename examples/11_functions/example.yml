# Run from the repository root:
#   python jinest.py examples/11_functions/example.yml --output-format yaml
#
# Function declarations are lazy helpers. Their suffixed declaration keys are
# omitted from the final mapping; a namespace containing only functions remains {}.

square(x)$: x * x
quote(value, mark='"')@: "{{ mark }}{{ value }}{{ mark }}"

clamp(value, minimum, maximum)^: |
  % if value < minimum
  %   return minimum
  % endif
  % if value > maximum
  %   return maximum
  % endif
  % return value

# A script function can return a native structure over several line statements.
make_result(value)^: |
  % return {
  %   "value": value,
  %   "type": "generated"
  % }

# A structural function returns a fresh lazy mapping for every destination.
# Its `context` and `path` are derived from that destination binding, while
# `origin` remains at this declaration. Parameters are available in the body.
service_config(name, port, key='label')=:
  name$: name
  address@: "{{ context.host }}:{{ port }}"
  path@: "{{ context.path }}"
  # Dynamic keys and inline directives work inside a structural body as well.
  =$key: "=@{{ name | upper }}"

# Structural functions may return lists as well as mappings.
pair(left, right)=:
  - '=$left'
  - '=$right'

# This body exposes destination paths so independent rebinding is visible.
destination_node(value)=:
  value$: value
  where@: "{{ context.path }}"
  nested:
    where@: "{{ context.path }}"

strings:
  upper(value)$: value | upper
  quote(value)@: "<{{ value }}>"

defaults:
  factor: 10
scale(value, factor=global_root.defaults.factor)$: value * factor

# `context` is the call-site mapping, even though the function is declared here.
helpers:
  prefix: helper-
  format(value)@: "{{ context.prefix }}{{ value }}"

native_result$: square(5)
text_result@: "{{ quote(square(5)) }}"
script_result$: clamp(15, 0, 10)
structured_result$: make_result("hello")
list_structural_result$: pair("left", "right")

# Accessing the temporary binding before return must not freeze it. Attaching
# the same node twice creates independent bindings and fresh nested caches.
rebound_nodes^: |
  % set shared = global_root.destination_node(10)
  % set temporary_where = shared.where
  % return {"x": shared, "y": shared, "temporary_where": temporary_where}

# The returned mapping is evaluated lazily at this destination. Its path is
# `global_root.deployments.primary`, and its dynamic label is materialized here.
deployments:
  host: api.example.test
  primary: "=$global_root.service_config('jinest', 8080)"

scaled_result$: scale(5)
namespace_result@: "{{ strings.quote(strings.upper('hello')) }}"

output:
  prefix: output-
  formatted@: "{{ global_root.helpers.format('name') }}"
