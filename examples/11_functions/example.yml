# Run from the repository root:
#   python jinest.py examples/11_functions/example.yml --output-format yaml
#
# Function declarations are lazy helpers. Their suffixed declaration keys are
# omitted from the final mapping; a namespace containing only functions remains {}.

square(x)$: x * x
quote(value, mark='"')@: "{{ mark }}{{ value }}{{ mark }}"

clamp(value, minimum, maximum)^: |
  % if value < minimum
  %   return minimum
  % endif
  % if value > maximum
  %   return maximum
  % endif
  % return value

# A script function can return a native structure over several line statements.
make_result(value)^: |
  % return {
  %   "value": value,
  %   "type": "generated"
  % }

# A structural function returns a fresh lazy mapping at every call site.
# Its `context` and `path` are those of the call-site mapping, while `origin`
# remains at this declaration. Parameters are available inside the body.
service_config(name, port, key='label')=:
  name$: name
  address@: "{{ context.host }}:{{ port }}"
  path@: "{{ context.path }}"
  # Dynamic keys and inline directives work inside a structural body as well.
  =$key: "=@{{ name | upper }}"

strings:
  upper(value)$: value | upper
  quote(value)@: "<{{ value }}>"

defaults:
  factor: 10
scale(value, factor=global_root.defaults.factor)$: value * factor

# `context` is the call-site mapping, even though the function is declared here.
helpers:
  prefix: helper-
  format(value)@: "{{ context.prefix }}{{ value }}"

native_result$: square(5)
text_result@: "{{ quote(square(5)) }}"
script_result$: clamp(15, 0, 10)
structured_result$: make_result("hello")

# The returned mapping is evaluated lazily at this call site. `context` within
# it therefore sees `deployments`, and its dynamic label is materialized here.
deployments:
  host: api.example.test
  primary: "=$global_root.service_config('jinest', 8080)"

scaled_result$: scale(5)
namespace_result@: "{{ strings.quote(strings.upper('hello')) }}"

output:
  prefix: output-
  formatted@: "{{ global_root.helpers.format('name') }}"
