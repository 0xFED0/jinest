base: 4

# Native expressions may return structures; numeric/boolean bodies pass through.
native_values:
  - 5
  - 8
  - true
  - nested: 4
  - global_root.native_values[4]
  - 99

# Text templates always become strings.
text_values:
  - base=4
  - root=4
  - item path=global_root.text_values[2]
  - '99'

script_values:
  - 14
  - doubled: 8
  - 99

# These plain strings were returned by one expression and contain no explicit
# inline directive, so they remain data.
computed_list:
  - base + 1
  - root.base

# Generated structures are normal Jinest subtrees unless escaped.
generated_tree:
  literal$: not evaluated
  computed: 10
  escaped_inline: =$base

first_large: 7
summary:
  count: 4
  total: 10
standard_block_syntax: 12
literal_percent_text: |-
  % this line remains ordinary text
  base=4
empty_return: null
implicit_null: null
last_native: 99
middle_native: [8, true]
