# Run from the repository root:
#   python jinest.py examples/02_scripts_and_arrays/example.yml --output-format yaml
#
# Lists directly under $, @, or ^ resolve each string item in that mode.

base: 4

# Each string item is an independent native expression; numbers and booleans pass through.
native_values$:
  - base + 1
  - root.base * 2
  - "true"
  - "{'nested': base}"
  - path
  - 99

# Every item must be a string because @ always renders a text template.
text_values@:
  - "base={{ base }}"
  - "root={{ root.base }}"
  - "item path={{ path }}"
  - "99"

# Script strings execute independently; numeric/boolean items pass through.
script_values^:
  - |
      % return base + 10
  - |
      % set doubled = base * 2
      % return {"doubled": doubled}
  - "% return 99"

# The expression itself runs once. Its returned list then becomes an ordinary
# Jinest subtree: plain strings stay data, while explicit inline directives
# would still be recognized. (`$` rejects template delimiters in its source.)
computed_list$: "['base + 1', 'root.base']"

# Returned mappings are parsed the same way. A raw generated key stays literal,
# a mode key is evaluated, and a leading backtick escapes an inline directive.
generated_tree$: >-
  {'literal$`': 'not evaluated', 'computed$': 'global_root.base + 6',
   'escaped_inline': '`=$base'}

# `return` exits immediately, including from nested loops/conditionals.
first_large^: |
  % for item in [1, 3, 7, 9]
    % if item > base
      % return item
    % endif
  % endfor
  % return none

# Scripts can accumulate values and return a structured object.
summary^: |
  % set ns = namespace(total=0)
  % for item in [1, 2, 3, 4]
    % set ns.total = ns.total + item
  % endfor
  % return {"count": 4, "total": ns.total}

# Standard Jinja block delimiters are accepted in scripts too.
standard_block_syntax^: |
  {% set tripled = base * 3 %}
  {% return tripled %}

# `%` has no special meaning in @ text templates.
literal_percent_text@: |
  % this line remains ordinary text
  base={{ base }}

# An empty return and reaching the end both resolve to null.
empty_return^: |
  % return
implicit_null^: |
  % set local_only = 123

# Lazy sequence proxies support negative indexes and slices in expressions.
last_native$: native_values[-1]
middle_native$: native_values[1:3]
